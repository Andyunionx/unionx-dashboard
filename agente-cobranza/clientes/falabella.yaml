nombre: "Cliente Falabella Fcom"
slug: falabella

partners:
  todos:    [14]
  boletas:  [14]
  facturas: [14]
  rut: "66666666-6"

excel:
  # Relativo a la carpeta "Trabajado clientes" (compartida con el bot)
  drive_path: "FALABELLA/Falabella desde abril 2026 B.xlsx"
  output_suffix: "_ACTUALIZADO"
  hojas_preservar: []      # ⚠️ verificar con Víctor: el MD no lista preservadas

# Falabella sí usa XLOOKUP en BOL contra hoja yuju
# Nota del MD: "col G = Marketplace Reference; BOL tiene XLOOKUP en col J"
xlookup_setup:
  - hoja: "BOL PENDIENTE DE PAGO"
    columna: J
    formula: '=XLOOKUP(I{fila},yuju!D:D,yuju!G:G,0,0)'

ventanas_dias:
  pagadas: -300
  yuju:    -200

name = "unionx-pulso-scheduler"
main = "worker.js"
compatibility_date = "2026-06-03"

# Cron de Cloudflare (UTC, confiable). Dispara el Pulso Diario L-V 07:30 CLT
# = 11:30 UTC. Backup del cron de GitHub Actions que es poco fiable en free tier
# (saltos frecuentes de corridas).
#
# GitHub Actions ya tiene un cron en email_diario.yml para la misma hora; si
# ambos disparan el mismo dia, el segundo workflow_dispatch genera otra
# corrida (no es idempotente). Para evitar duplicacion, mantener UNO solo
# activo. Recomendado: deshabilitar el cron del workflow YAML y dejar SOLO
# este Worker como trigger.
[triggers]
crons = ["30 11 * * 1-5"]

# Variables NO secretas (el token va por `wrangler secret put GH_TOKEN`).
[vars]
GH_OWNER = "Andyunionx"
GH_REPO = "unionx-dashboard"
GH_WORKFLOW = "email_diario.yml"
GH_REF = "main"

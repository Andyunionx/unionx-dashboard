name: Sync ventas mes actual (diario)

# Descarga ventas del mes corriente desde Turso y commitea ventas_mes_actual.parquet.
# Los tabs de Análisis Planificación leen este parquet al arrancar.

on:
  schedule:
    # 11:00 AM Chile (UTC-3 verano / UTC-4 invierno) → 14:00 UTC cubre ambos
    - cron: '0 14 * * *'
  workflow_dispatch:       # permite lanzar manualmente desde GitHub Actions

jobs:
  sync:
    name: Sync ventas mes actual
    runs-on: ubuntu-latest
    permissions:
      contents: write      # necesario para git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install pandas pyarrow requests

      - name: Ejecutar sync
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python sync_ventas_mes_actual.py

      - name: Commit parquet actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico/ventas_mes_actual.parquet
          # Solo commitea si hubo cambio real
          git diff --staged --quiet && echo "Sin cambios — nada que commitear" || \
            git commit -m "data: sync ventas_mes_actual $(date -u +%Y-%m-%d)"
          git push

name: Sync ventas mes actual (diario)

# ⛔ DESHABILITADO (21-jul-2026): leía de TURSO (muerto desde may-2026) y CLOBBEABA
# el ventas_mes_actual.parquet bueno del extract Odoo (clobber julio 20 y 21-jul).
# La fuente válida del mes_actual es el extract Odoo (email_diario / sync_mes_actual).
# Se quita el schedule; queda solo manual. sync_ventas_mes_actual.py además no-opea
# salvo FORCE_TURSO_SYNC=1.

on:
  workflow_dispatch:       # solo manual (schedule removido)

jobs:
  sync:
    name: Sync ventas mes actual
    runs-on: ubuntu-latest
    permissions:
      contents: write      # necesario para git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install pandas pyarrow requests

      - name: Ejecutar sync
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python sync_ventas_mes_actual.py

      - name: Commit parquet actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico/ventas_mes_actual.parquet
          # Solo commitea si hubo cambio real
          git diff --staged --quiet && echo "Sin cambios — nada que commitear" || \
            git commit -m "data: sync ventas_mes_actual $(date -u +%Y-%m-%d)"
          git push

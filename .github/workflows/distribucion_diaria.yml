name: Distribución Diaria (42410104)

# Corre 9 AM Chile (12 UTC invierno, 13 UTC verano).
# Detecta facturas con líneas en 42410104, clasifica con IA/keywords,
# descarga SII, detecta RUTs sin partner y envía mail a Camila + Victor.
#
# Puede ser disparado manualmente desde GitHub Actions para testing.

on:
  workflow_dispatch:
  schedule:
    # 9 AM Chile = 12 UTC (UTC-3 horario invierno)
    - cron: '0 12 * * 1-5'

concurrency:
  group: distribucion-diaria
  cancel-in-progress: false

permissions:
  contents: write   # necesario para commit de memoria_distribucion/ y archivos SII

jobs:
  distribucion:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r agente-odoo/requirements.txt
          pip install -r requirements.txt

      - name: Instalar Playwright + Xvfb (para SII browser)
        run: |
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Escribir token Gmail
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p agente-comex/config
          echo "$GMAIL_TOKEN_JSON" > agente-comex/config/token.json

      - name: Restaurar módulos desde git
        run: |
          git checkout agente-odoo/src/actions/distribucion/ \
                       agente-odoo/src/actions/compras/ \
                       agente-odoo/scripts/run_distribucion.py 2>/dev/null || true

      - name: Ejecutar distribución diaria
        env:
          PYTHONIOENCODING: utf-8
          DISPLAY: ':99'
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          SII_RUT: ${{ secrets.SII_RUT }}
          SII_PASSWORD: ${{ secrets.SII_PASSWORD }}
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          python -X utf8 agente-odoo/scripts/run_distribucion.py --send-mail

      - name: Commit memoria + archivos SII descargados
        run: |
          git config user.email "agente@unionx.cl"
          git config user.name "Agente Distribución"
          git add agente-odoo/data/memoria_distribucion/ \
                  data/contabilidad/sii/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(distribucion): actualización automática $(date -u +%Y-%m-%d)"
          git push || true
        continue-on-error: true

      - name: Upload debug artifacts en fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distribucion-debug-${{ github.run_id }}
          path: agente-odoo/data/distribucion/
          retention-days: 3

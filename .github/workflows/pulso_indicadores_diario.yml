name: Pulso Indicadores Diario

on:
  schedule:
    # Objetivo ~08:00 CLT. Se programa 09:47 UTC (06:47 CLT) con minuto impar porque
    # GH free tier retrasa 1-4h los crons (peor en minuto 0): con el delay típico
    # aterriza entre 07:30 y 09:00 CLT.
    - cron: '47 9 * * 1-5'
  workflow_dispatch: {}

jobs:
  pulso-indicadores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib
      - name: Correr pulso
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python pulso_indicadores_diario.py

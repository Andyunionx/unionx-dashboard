name: "Watchdog Macro Rentabilidad"

# Dos fallas distintas, dos chequeos distintos:
#
#   1. QUE EL PROCESO CORRA. Si el cron de macro_rentabilidad.yml no corrió el
#      lunes, este workflow lo ejecuta. Mismo patrón que el watchdog del Pulso
#      Diario: workflow_call y no workflow_dispatch, porque el GITHUB_TOKEN de
#      Actions no puede gatillar otro workflow (GitHub lo bloquea por recursión).
#
#   2. QUE LA PLANILLA SIRVA. El proceso puede correr perfecto todos los lunes y
#      la macro igual quedar inútil si Gabriela dejó de cargar su parte: el RAW
#      traería la venta y faltarían las comisiones, con lo que el margen sale
#      inflado y nadie se entera. Eso lo revisa macro_rentabilidad_watchdog.py,
#      que avisa por correo SOLO a Andrés y solo cuando falta algo.

on:
  schedule:
    - cron: '0 18 * * 1'      # 14:00 CLT lunes — 5h después del cron de la macro
    - cron: '0 14 * * 3'      # 10:00 CLT miércoles — segunda pasada de la planilla
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  revisar_corrida:
    runs-on: ubuntu-latest
    outputs:
      falta: ${{ steps.chk.outputs.falta }}
    steps:
      - name: ¿Corrió la macro esta semana?
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lunes de esta semana en UTC
          LUNES=$(date -u -d "last monday" +%Y-%m-%d)
          [ "$(date -u +%u)" = "1" ] && LUNES=$(date -u +%Y-%m-%d)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/macro_rentabilidad.yml/runs?per_page=30" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$LUNES\") | select(.conclusion == \"success\" or .status == \"in_progress\")] | length")
          echo "Corridas exitosas desde el lunes $LUNES: $N"
          if [ "$N" -gt 0 ]; then
            echo "falta=false" >> $GITHUB_OUTPUT
            echo "La macro ya corrió — el watchdog no la dispara."
          else
            echo "falta=true" >> $GITHUB_OUTPUT
            echo "::warning::La macro de rentabilidad no corrió esta semana. El watchdog la ejecuta."
          fi

  macro:
    needs: revisar_corrida
    if: needs.revisar_corrida.outputs.falta == 'true'
    uses: ./.github/workflows/macro_rentabilidad.yml
    secrets: inherit

  revisar_planilla:
    needs: [revisar_corrida, macro]
    # `always()` para que corra tanto si la macro se disparó como si no hizo falta
    if: always() && needs.revisar_corrida.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ¿Está viva la planilla?
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          MACRO_WATCHDOG_TO: ${{ vars.MACRO_WATCHDOG_TO || 'andres@unionx.cl' }}
          PYTHONIOENCODING: utf-8
        run: python -u macro_rentabilidad_watchdog.py

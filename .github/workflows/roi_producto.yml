name: ROI por producto (vigía L-V 08:00 y 14:00 CLT · resumen lunes)

# Andrés 1-oct-2026: el ROI se recalcula solo cuando cambia la Maestra Pricing, la Maestra COMEX o la Maestra
# Productos (cierre de mes, negociación), y todos los lunes. Publica el Excel en Drive "ROI UnionX", reescribe la
# pestaña DATAA de la Planificación Forecast 2027 (ROI / EVA / clasificación por SKU) y, el lunes, manda el resumen.
# Supuestos: panel "Supuestos ROI" en Drive (incluye el selector de alcance de unidades).
# Si un control de calidad falla, no publica y avisa solo a Andrés. Script: roi_automatico.py

on:
  schedule:
    - cron: "0 11 * * 1-5"     # 08:00 CLT (horario de verano, UTC−3)
    - cron: "0 17 * * 1-5"     # 14:00 CLT
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recalcular aunque las maestras no hayan cambiado"
        type: boolean
        default: false
      lunes:
        description: "Corrida semanal: recalcular y enviar el resumen"
        type: boolean
        default: false
      sin_enviar:
        description: "No enviar correos (prueba)"
        type: boolean
        default: false

concurrency:
  group: roi-producto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  roi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client
      - name: Caché del stock diario (se reconstruye desde Odoo cuando cambia la ventana)
        uses: actions/cache@v4
        with:
          path: |
            data/roi/stock_diario_roi.parquet
            data/roi/odoo_productos.parquet
            data/roi/odoo_plantillas.parquet
            data/roi/odoo_kits.parquet
          key: roi-odoo-${{ github.run_id }}
          restore-keys: roi-odoo-
      - name: ROI automático
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          ROI_CRON: ${{ github.event.schedule }}
          ROI_RESUMEN_TO: ${{ vars.ROI_RESUMEN_TO || 'nicolas@unionx.cl,nicole@unionx.cl,felipe@unionx.cl,sguzman@unionx.cl,martin@unionx.cl' }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          if [ "${{ github.event.inputs.lunes }}" = "true" ]; then ARGS="$ARGS --lunes"; fi
          if [ "${{ github.event.inputs.sin_enviar }}" = "true" ]; then ARGS="$ARGS --sin-enviar"; fi
          python roi_automatico.py $ARGS

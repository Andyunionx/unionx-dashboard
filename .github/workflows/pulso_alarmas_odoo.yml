name: Pulso Alarmas Odoo

on:
  schedule:
    # Gatillo propio repuesto el 10-nov-2026. El 20-ago se movio al pulso diario
    # (email_diario.yml) y el 8-sep ese paso se borro: el vigia quedo sin gatillo
    # y con 0 corridas. Vuelve a su cron original, independiente del pulso.
    # 10:52 UTC = 07:52 de Chile en horario de verano; GitHub puede atrasarlo.
    - cron: '52 10 * * *'
  workflow_dispatch: {}

jobs:
  pulso-alarmas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib
      - name: Correr pulso
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # Solo Andres hasta que el amplie destinatarios (el default del script
          # incluye a terceros).
          ALARMAS_EMAIL_TO: andres@unionx.cl
        run: python pulso_alarmas_odoo.py

name: Pulso Alarmas Odoo

on:
  schedule:
    # RESPALDO. GitHub atrasa sus crons 6 a 11 horas en este repo (del 11 al 23-nov-2026 este corrió entre las
    # 16:44 y las 22:15 UTC), así que el gatillo principal es un workflow_dispatch externo a las 10:52 UTC
    # (07:52 de Chile en horario de verano): el Worker de Cloudflare (scheduler/worker.js) y, de segundo
    # respaldo, la tarea local del PC. Si el vigía ya corrió hoy con éxito, el paso "ya corrió hoy" salta este cron.
    # Historia: el 20-ago se movió al pulso diario, el 8-sep ese paso se borró (0 corridas) y el 10-nov-2026 se
    # repuso el gatillo propio.
    - cron: '52 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: pulso-alarmas-odoo
  cancel-in-progress: false

jobs:
  pulso-alarmas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ya corrió hoy (solo para el cron de respaldo)
        id: hoy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          n=0
          if [ "$EVENTO" = "schedule" ]; then
            # «Hoy» es el día de Chile, no el UTC: desde las 21:00 de Chile en UTC ya es el día siguiente. Con el
            # día UTC, un cron atrasado más de 13 h no veía la corrida de la mañana y repetía el correo (le pasó
            # al watchdog del Pulso Diario el 9-nov-2026). Misma expresión que watchdog_pulso.yml.
            HOY=$(TZ=America/Santiago date +%Y-%m-%d)
            DESDE=$(date -u -d "TZ=\"America/Santiago\" $HOY 00:00" +%Y-%m-%dT%H:%M:%SZ || true)
            if [[ "$DESDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T0[34]:00:00Z$ ]]; then
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pulso_alarmas_odoo.yml/runs?per_page=30" \
                    --jq "[.workflow_runs[] | select(.created_at >= \"$DESDE\") | select(.conclusion == \"success\") | select(.id != $GITHUB_RUN_ID)] | length" || true)
              echo "Día de Chile $HOY · corridas exitosas desde $DESDE: ${n:-sin dato}"
            else
              echo "::warning::No pude calcular la medianoche de Chile ($DESDE)."
            fi
            # Es una alarma: ante la duda corre (mejor un correo repetido a Andrés que un día sin vigía).
            [[ "$n" =~ ^[0-9]+$ ]] || n=0
          fi
          echo "previas=$n" >> "$GITHUB_OUTPUT"
          echo "Corridas exitosas de hoy: $n · evento: $EVENTO"
      - uses: actions/checkout@v4
        if: steps.hoy.outputs.previas == '0'
      - uses: actions/setup-python@v5
        if: steps.hoy.outputs.previas == '0'
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        if: steps.hoy.outputs.previas == '0'
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib
      # Estado de la corrida anterior (negativos y versión de madkting): permite decir qué es NUEVO y la tendencia.
      # Son ids de producto y ubicación con cantidades; no lleva nombres ni precios unitarios.
      - name: Recuperar el estado de la corrida anterior
        if: steps.hoy.outputs.previas == '0'
        uses: actions/cache/restore@v4
        with:
          path: .estado_vigia
          key: vigia-estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vigia-estado-
      - name: Correr pulso
        if: steps.hoy.outputs.previas == '0'
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # El pulso completo va solo a Andrés hasta que él amplíe destinatarios.
          ALARMAS_EMAIL_TO: andres@unionx.cl
          # INTERRUPTOR del correo corto a bodega (solo negativos NUEVOS de Entrada/Salida, con copia a Andrés;
          # diseño aprobado el 15-nov-2026). Es esta única línea:
          #   apagado   → NEGATIVOS_EMAIL_TO: ''
          #   encendido → NEGATIVOS_EMAIL_TO: gerardo@unionx.cl
          # El script no trae destinatario por defecto: si esta línea falta o está vacía, no le escribe a nadie.
          NEGATIVOS_EMAIL_TO: ''
        run: python pulso_alarmas_odoo.py
      # Solo si el correo salió: si falla el envío, mañana se compara contra el estado anterior y nada se pierde.
      # La llave lleva el intento: en un reintento de la misma corrida la llave anterior ya existe y no se guardaría.
      - name: Guardar el estado para la próxima corrida
        if: steps.hoy.outputs.previas == '0' && success()
        uses: actions/cache/save@v4
        with:
          path: .estado_vigia
          key: vigia-estado-${{ github.run_id }}-${{ github.run_attempt }}

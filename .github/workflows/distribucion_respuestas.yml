name: Distribución Respuestas (leer y aplicar en Odoo)

# Lee respuestas de Camila/Victor en Gmail, aplica los cambios de cuenta
# en Odoo y confirma las facturas. Corre 3 veces al día.
#
# Puede dispararse manualmente para procesar una respuesta puntual.

on:
  workflow_dispatch:
  schedule:
    # 10:30, 14:00, 16:30 Chile = 13:30, 17:00, 19:30 UTC (UTC-3 invierno)
    - cron: '30 13 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '30 19 * * 1-5'

concurrency:
  group: distribucion-respuestas
  cancel-in-progress: false

permissions:
  contents: write   # para commit de memoria_distribucion/

jobs:
  respuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r agente-odoo/requirements.txt
          pip install -r requirements.txt

      - name: Escribir token Gmail
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p agente-comex/config
          echo "$GMAIL_TOKEN_JSON" > agente-comex/config/token.json

      - name: Crear .env con credenciales
        run: |
          echo "ANDRES_ODOO_PASSWORD=${{ secrets.ANDRES_ODOO_PASSWORD }}" >> .env

      - name: Restaurar módulos desde git
        run: |
          git checkout agente-odoo/src/actions/distribucion/ \
                       agente-odoo/scripts/run_distribucion.py 2>/dev/null || true

      - name: Leer respuestas y aplicar en Odoo
        env:
          PYTHONIOENCODING: utf-8
        run: python -X utf8 agente-odoo/scripts/run_distribucion.py --leer-respuestas

      - name: Commit memoria actualizada
        run: |
          git config user.email "agente@unionx.cl"
          git config user.name "Agente Distribución"
          git add agente-odoo/data/memoria_distribucion/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(distribucion): memoria actualizada $(date -u +%Y-%m-%d)"
          git push || true
        continue-on-error: true

name: "Cyber Pulso (horario, Cyber oct lun 5 → dom 11)"

# Pulso horario del Cyber de octubre 2026. Lo dispara cyber_reloj.yml cada hora en punto
# entre el lun 5-oct 06:00 y el lun 12-oct 06:00 CLT vía workflow_dispatch (el cron de
# GitHub no se usa directo porque se atrasa horas o se salta corridas).
# Cada corrida: re-extrae el mes en curso desde Odoo (la app queda fresca cada hora) y
# enviar_pulso_cyber_oct.py decide si manda correo: cada 2 h (horas pares 08:00–24:00 CLT),
# con dos validaciones antes (parquet sano + venta del día vs Odoo state=sale).

on:
  workflow_dispatch:
    inputs:
      preborrador:
        description: 'Asunto [PRE-BORRADOR] y enviar solo a Andrés'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_email:
        description: 'Forzar el correo ignorando la ventana horaria'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      forzar_rango:
        description: 'Correr aunque esté fuera de las fechas del Cyber (pruebas; usar con preborrador=true)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: cyber-pulso
  cancel-in-progress: false

jobs:
  pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (enriquecimiento CMR desde Sheet)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json; else echo "[WARN] sin GOOGLE_CREDENTIALS_JSON — CMR se omite"; fi

      - name: Re-extract mes en curso desde Odoo + CMR
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_mes_actual_a_parquet.py --source odoo

      - name: Dedup del mes en curso
        run: |
          python <<'PYEOF'
          import pandas as pd
          path = 'data/historico/ventas_mes_actual.parquet'
          df = pd.read_parquet(path)
          cols = [c for c in ['pedido','sku','hora_venta','venta_bruta','cantidad','documento','tipo_movimiento','canal','fecha_venta'] if c in df.columns]
          n0 = len(df)
          df = df.drop_duplicates(subset=cols, keep='first')
          df.to_parquet(path, index=False)
          print(f'[Dedup] {n0:,} → {len(df):,} filas · ${df["venta_bruta"].sum():,.0f}')
          PYEOF

      - name: Commit parquet actualizado (app fresca)
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Cyber Pulso"
          git add data/historico/ventas_mes_actual.parquet || true
          if git diff --staged --quiet; then
            echo "Sin cambios parquet"
          else
            git commit -m "Cyber Pulso refresh parquet: $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            git pull --rebase origin main || true
            git push || echo "Push falló (no crítico)"
          fi

      - name: Enviar pulso Cyber
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # preborrador=true → solo Andrés. Lista del Cyber: variable CYBER_EMAIL_TO del repo
          # (mientras no se configure, sale solo a Andrés).
          EMAIL_TO: ${{ github.event.inputs.preborrador == 'true' && 'andres@unionx.cl' || (vars.CYBER_EMAIL_TO || 'andres@unionx.cl') }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          CYBER_PREBORRADOR: ${{ github.event.inputs.preborrador == 'true' && '1' || '0' }}
          CYBER_FORCE_EMAIL: ${{ github.event.inputs.force_email == 'true' && '1' || '0' }}
          CYBER_FORZAR_RANGO: ${{ github.event.inputs.forzar_rango == 'true' && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python enviar_pulso_cyber_oct.py

name: Sync Planificación (ventas + stock + tránsito → Turso)

on:
  schedule:
    # 06:00 AM Chile = 09:00 UTC (UTC-3)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow libsql-client requests

      - name: Ejecutar sync_planificacion
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python sync_planificacion.py

name: Sync OTIF Drive (Sheet → snapshot JSON)

on:
  schedule:
    # OTIF se actualiza 1x al mes en el Sheet (Andrés 2026-05-11).
    # Refrescamos snapshot el día 01 y el día 10 del mes a 03:00 UTC = 00:00 Chile.
    - cron: '0 3 1 * *'
    - cron: '0 3 10 * *'
  workflow_dispatch:  # permite ejecutar manualmente

jobs:
  sync_otif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow streamlit gspread google-auth

      - name: Crear credentials.json desde secret
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT" ]; then
            echo "$GCP_SERVICE_ACCOUNT" > credentials.json
            echo "credentials.json creado desde secret"
          else
            echo "WARN: GCP_SERVICE_ACCOUNT secret no configurado"
          fi

      - name: Ejecutar extract OTIF Drive
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_otif_drive.py

      - name: Commit snapshot si cambió
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions OTIF Sync"
          git add data/kpis_wms/snapshot.json
          git diff --staged --quiet || git commit -m "OTIF Drive snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Limpiar credentials
        if: always()
        run: rm -f credentials.json

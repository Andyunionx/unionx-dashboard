name: Sync Stock Snapshot (Odoo → parquet)

on:
  schedule:
    # Cada 3h (8 corridas/día × ~3 min = 24 min/día = ~720 min/mes — cabe en cuota free)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync_stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # para hacer commit de los parquets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Ejecutar extracción
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_stock_snapshot.py

      - name: Commit parquets si cambiaron
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Stock Sync"
          git add data/stock/
          git diff --staged --quiet || git commit -m "Stock snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

name: "Macro Rentabilidad por Canal (lunes)"

# Refresca el Google Sheet compartido con Gabriela:
#   1. RAW ventas    -> lo reescribe entero desde el parquet + modalidad de Odoo
#   5. Base dinámica -> RAW + carga de Gabriela, con el monto ya con signo
#   6. Rentabilidad  -> tabla dinámica nativa sobre la base
#
# NUNCA escribe en "2. Carga Gabriela". Esa pestaña es de ella y el script solo
# la lee. Por eso puede correr sin riesgo de pisarle el trabajo.
#
# Cadencia: lunes, que es cuando se carga la planilla. Se puede disparar a mano
# con workflow_dispatch, y el watchdog lo llama con workflow_call si el lunes
# no corrió (el GITHUB_TOKEN no puede gatillar otro workflow, por eso es
# workflow_call y no workflow_dispatch).

on:
  schedule:
    - cron: '0 13 * * 1'      # 09:00 CLT lunes (GHA free suele atrasarse 5-30 min)
  workflow_dispatch:
    inputs:
      desde:
        description: 'Mes inicial (YYYY-MM)'
        required: false
        default: '2026-07'
  workflow_call:

permissions:
  contents: read

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refrescar la macro
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          # Desde julio 2026 en adelante (decisión Andrés 15-09). Hasta el mes
          # en curso, para que el mes abierto también se vea.
          DESDE="${{ github.event.inputs.desde || '2026-07' }}"
          HASTA=$(date -u +%Y-%m)
          echo "Rango: $DESDE a $HASTA"
          python -u macro_rentabilidad_drive.py --desde "$DESDE" --hasta "$HASTA"

# Categoría padre/hijo por SKU desde la Maestra Pricing (fuente única que mantiene Felipe, Andrés 8-oct-2026).
# Baja la Pricing de Drive y deja data/planillas/categorias_pricing.csv en el repo; el extract del RAW la aplica
# (mejoras_raw_overlay.py, P1e). Corre antes del Pulso Diario y a mediodía; el cron de GHA free se atrasa, por eso dos.
name: Categorías desde la Maestra Pricing

on:
  schedule:
    - cron: '0 8 * * *'       # 05:00 CLT
    - cron: '0 15 * * *'      # 12:00 CLT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: categorias-pricing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pandas openpyxl google-auth google-auth-oauthlib google-api-python-client

      - name: Bajar categorías de la Pricing
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          PYTHONIOENCODING: utf-8
        run: python sync_categorias_pricing.py

      - name: Guardar si cambió
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Categorías Pricing"
          git add data/planillas/categorias_pricing.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en las categorías"
          else
            git commit -m "Categorías Pricing: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

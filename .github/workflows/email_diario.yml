name: Email Diario Raw Ventas

on:
  schedule:
    # 8:00 AM Chile = 12:00 UTC (Chile UTC-4 sin DST)
    - cron: '0 12 * * *'
  workflow_dispatch:    # Permite trigger manual

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Enviar email
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'andres@unionx.cl' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          PYTHONIOENCODING: utf-8
        run: python enviar_excel_diario.py

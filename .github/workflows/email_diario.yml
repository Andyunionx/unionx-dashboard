name: Pulso Diario UnionX (Lun-Vie 07:30 CLT)

# Pulso diario con acumulado mes + YoY mismo período + Top canales/marcas/categorías.
# Excel RAW adjunto = ventas acumuladas del mes hasta el día anterior (sin venta_neta).
# Destinatarios via vars.PULSO_DIARIO_EMAIL_TO (default 12).

on:
  # SIN cron de GitHub Actions: el trigger oficial es el Cloudflare Worker
  # "patient-cloud-327e" (cron 30 11 * * MON-FRI = 07:30 CLT), que hace
  # workflow_dispatch via API. El cron de GHA free tier disparaba con delay
  # de hasta 3.5h y duplicaba el mail (incidente 11-jun-2026: pulso 07:30
  # via Cloudflare + pulso 11:03 via cron GHA atrasado).
  workflow_dispatch:
    inputs:
      solo_live:
        description: "Solo refrescar parquet + LIVE en Drive, SIN enviar el mail del pulso"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (CMR enrichment)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          else
            echo "[WARN] GOOGLE_CREDENTIALS_JSON no configurado — CMR se omitirá"
          fi

      - name: Re-extract parquet Odoo (fresh hasta ayer)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_mes_actual_a_parquet.py --source odoo

      - name: Commit parquet refrescado al repo
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Pulso Diario"
          git add data/historico/ventas_mes_actual.parquet || true
          if git diff --staged --quiet; then
            echo "Sin cambios parquet"
          else
            git commit -m "Pulso Diario refresh parquet: $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            git pull --rebase origin main || true
            git push || echo "Push falló (no crítico)"
          fi

      - name: Regenerar Reporte Ventas Empresa LIVE + subir a Drive
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          PYTHONIOENCODING: utf-8
        run: python actualizar_raw_diario.py
        continue-on-error: true

      - name: Enviar Pulso Diario
        if: ${{ github.event.inputs.solo_live != 'true' }}
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_TO: ${{ vars.PULSO_DIARIO_EMAIL_TO || 'andres@unionx.cl,nicolas@unionx.cl,nicole@grupoeter.cl,martin@grupoeter.cl,sguzman@grupoeter.cl,trinidad@unionx.cl,claudia@unionx.cl,ignacia@unionx.cl,michela@unionx.cl,felipe@unionx.cl,maximiliano@unionx.cl,gabriela@grupoeter.cl' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          PYTHONIOENCODING: utf-8
        run: python enviar_pulso_diario.py

      - name: Enviar Pulso Stock Live (tabla dinámica por bodega)
        # ACTIVO desde 25-jun-2026: corre si vars.PULSO_STOCK_ENABLED == 'true'.
        # Stock fresco: sync_stock c/3h. Fulfillment LIVE de Martín (feed 6 AM,
        # mail "Pulso Fulfillment Marketplaces" a andres@unionx.cl) desde 15-jul-2026:
        # se baja antes del pulso; si falla, el pulso cae al fulfillment de Odoo.
        if: ${{ github.event.inputs.solo_live != 'true' && vars.PULSO_STOCK_ENABLED == 'true' }}
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_TO: ${{ vars.PULSO_STOCK_EMAIL_TO || 'nicolas@unionx.cl,nicole@grupoeter.cl,felipe@unionx.cl,sguzman@grupoeter.cl,martin@grupoeter.cl,gerardo@unionx.cl,facturacion@unionx.cl,trinidad@unionx.cl,ignacia@unionx.cl,claudia@unionx.cl,gabriela@grupoeter.cl,maximiliano@unionx.cl' }}
          FULFILLMENT_LIVE: ${{ vars.PULSO_STOCK_FULFILLMENT_LIVE || '1' }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$FULFILLMENT_LIVE" = "1" ]; then
            python fulfillment_live.py --no-cruce || echo "[warn] fetch fulfillment live falló → pulso usa Odoo"
          fi
          python enviar_pulso_stock.py
        continue-on-error: true

      - name: Enviar Pulso KPI Semanal (solo lunes)
        # ACTIVO (OK Andrés 15-jul-2026): corre si vars.PULSO_KPI_ENABLED=='true'
        # Y es lunes. KPIs WMS + COP inferido, semana vs semana vs mes anterior
        # (dinámico). Clasificación por categoria_wms: incluye reposiciones
        # fulfillment + BRST, excluye despachos del marketplace. WMS buffer 2 días.
        if: ${{ github.event.inputs.solo_live != 'true' && vars.PULSO_KPI_ENABLED == 'true' }}
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_TO: ${{ vars.PULSO_KPI_EMAIL_TO || 'andres@unionx.cl' }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$(date +%u)" = "1" ]; then
            SEND=1 python pulso_kpi_semanal.py
          else
            echo "No es lunes — Pulso KPI semanal omitido."
          fi
        continue-on-error: true

      - name: Enviar Reporte KPI Operacional MENSUAL (primer lunes del mes)
        # ACTIVO (OK Andrés 20-jul-2026): corre el PRIMER LUNES de cada mes.
        # Reporte mensual del mes cerrado más reciente (mes anterior), data-driven
        # desde parquet (WMS categoria_wms + ventas + control_gestion + OTIF snapshot).
        # HTML email-safe (tablas inline; el reporte "fancy" con gráficos es el
        # artifact de claude.ai, que CI no puede generar → link opcional vía var).
        # Envía a EMAIL_TO con copia a EMAIL_CC (Gerardo). Kill-switch: setear
        # vars.REPORTE_KPI_MENSUAL_ENABLED='false' para pausarlo.
        if: ${{ github.event.inputs.solo_live != 'true' && vars.REPORTE_KPI_MENSUAL_ENABLED != 'false' }}
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_TO: ${{ vars.REPORTE_KPI_EMAIL_TO || 'andres@unionx.cl' }}
          EMAIL_CC: ${{ vars.REPORTE_KPI_EMAIL_CC || 'gerardo@unionx.cl' }}
          ARTIFACT_URL: ${{ vars.REPORTE_KPI_ARTIFACT_URL || '' }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%-d)" -le 7 ]; then
            SEND=1 python reporte_kpi_operacional.py
          else
            echo "No es el primer lunes del mes — Reporte KPI mensual omitido."
          fi
        continue-on-error: true

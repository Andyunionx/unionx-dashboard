name: Sync KPIs WMS (Odoo → snapshot JSON)

on:
  schedule:
    # 03:00 UTC = 00:00 Chile (UTC-3)
    # 15:00 UTC = 12:00 Chile
    # 2 corridas/día según política definida con Andrés (2026-05-09)
    - cron: '0 3,15 * * *'
  workflow_dispatch:  # permite ejecutar manualmente

jobs:
  sync_kpis_wms:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 13+ queries Odoo pueden tardar varios minutos
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests streamlit libsql-client gspread google-auth

      - name: Pre-calcular KPIs WMS
        env:
          # Credenciales Odoo OPS (usuario operaciones)
          OPS_ODOO_USER: ${{ secrets.OPS_ODOO_USER }}
          OPS_ODOO_PASSWORD: ${{ secrets.OPS_ODOO_PASSWORD }}
          # Fallback a usuario Andrés si OPS no responde
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          # Turso para datos manuales (productividad usa get_equipo_mes)
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python precalcular_kpis_wms.py

      - name: Restaurar credentials.json (para Sheet Costo Operativo)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          fi

      - name: Extract Costo Operativo (Sheet Drive OPERACIONES 2025-2026)
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_ops_costo_operativo.py
        continue-on-error: true

      - name: Limpiar credentials
        if: always()
        run: rm -f credentials.json

      - name: Commit snapshot si cambió
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions KPIs WMS Sync"
          git add data/kpis_wms/ data/operaciones/
          git diff --staged --quiet || git commit -m "KPIs WMS + costo op snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

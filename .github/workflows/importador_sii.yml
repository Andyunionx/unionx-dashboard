name: Importador SII -> Odoo (Auto-ingreso DTEs)

on:
  workflow_dispatch:
  schedule:
    # 8:30 AM Chile (11:30 UTC invierno) -- 30 min antes de distribucion_diaria
    - cron: "30 11 * * 1-5"

concurrency:
  group: importador-sii
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r agente-odoo/requirements.txt
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Escribir token Gmail
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p agente-comex/config
          echo "$GMAIL_TOKEN_JSON" > agente-comex/config/token.json

      - name: Restaurar modulos desde git
        run: |
          git checkout agente-odoo/src/actions/compras/importador_rcv.py \
                        agente-odoo/src/actions/compras/importador_odoo.py \
                        agente-odoo/scripts/run_importador_sii.py 2>/dev/null || true

      - name: Ejecutar importador SII -> Odoo
        env:
          PYTHONIOENCODING: utf-8
          DISPLAY: ":99"
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          SII_RUT: ${{ secrets.SII_RUT }}
          SII_PASSWORD: ${{ secrets.SII_PASSWORD }}
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          python -X utf8 agente-odoo/scripts/run_importador_sii.py

      - name: Upload debug si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: importador-debug-${{ github.run_id }}
          path: /tmp/dte_*.xml
          retention-days: 3

name: "Sync mes actual a parquet"

on:
  # PAUSADO temporalmente mientras se sincroniza mayo retroactivo (~20 min).
  # Restaurar schedule cron '*/15 * * * *' cuando termine sync mayo.
  workflow_dispatch:
    inputs:
      mes:
        description: 'YYYY-MM (default: mes actual)'
        required: false
        default: ''
      source:
        description: 'Fuente: odoo (default, bypass Turso) o turso (legacy)'
        required: false
        default: 'odoo'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar mes actual (Odoo por default — bypass Turso)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          SOURCE="${{ github.event.inputs.source || 'odoo' }}"
          MES_ARG=""
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            MES_ARG="--mes ${{ github.event.inputs.mes }}"
          fi
          mkdir -p data/logs
          echo "[debug] source=$SOURCE mes_arg='$MES_ARG'" | tee data/logs/sync_mes_actual_last.log
          echo "[debug] secrets: LIBSQL_URL=${LIBSQL_URL:+set} ANDRES_ODOO_PASSWORD=${ANDRES_ODOO_PASSWORD:+set}" | tee -a data/logs/sync_mes_actual_last.log
          echo "[debug] python version: $(python --version)" | tee -a data/logs/sync_mes_actual_last.log
          python extract_mes_actual_a_parquet.py --source $SOURCE $MES_ARG 2>&1 | tee -a data/logs/sync_mes_actual_last.log

      - name: Sincronizar parquet a Turso (incluye manual_externa + fixes)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        continue-on-error: true  # si Turso falla, el parquet ya está commiteado
        run: |
          MES_ARG=""
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            MES_ARG="--mes ${{ github.event.inputs.mes }}"
          fi
          python sync_parquet_to_turso.py $MES_ARG 2>&1 | tee -a data/logs/sync_mes_actual_last.log

      - name: Upload log siempre (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-mes-actual-log-${{ github.run_id }}
          path: data/logs/sync_mes_actual_last.log
          retention-days: 14

      - name: Commit (parquet + log, siempre)
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Sync Mes"
          # Commit del log SIEMPRE (incluso si el step anterior falló).
          # Así el log queda en el repo y podemos diagnosticar sin auth.
          git add data/logs/sync_mes_actual_last.log || true
          git add data/historico/ventas_mes_actual.parquet || true
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear"
          else
            git commit -m "Sync mes actual: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Commit falló"
            git pull --rebase origin main || true
            git push || echo "Push falló"
          fi

name: "Sync mes actual a parquet"

on:
  schedule:
    # Cada hora en el minuto :30 (después del sync_diario que corre en :00)
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      mes:
        description: 'YYYY-MM (default: mes actual)'
        required: false
        default: ''
      source:
        description: 'Fuente: odoo (default, bypass Turso) o turso (legacy)'
        required: false
        default: 'odoo'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar mes actual (Odoo por default — bypass Turso)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          SOURCE="${{ github.event.inputs.source || 'odoo' }}"
          MES_ARG=""
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            MES_ARG="--mes ${{ github.event.inputs.mes }}"
          fi
          python extract_mes_actual_a_parquet.py --source $SOURCE $MES_ARG

      - name: Commit si cambió
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Sync Mes"
          git add data/historico/ventas_mes_actual.parquet
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear"
          else
            git commit -m "Sync mes actual: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

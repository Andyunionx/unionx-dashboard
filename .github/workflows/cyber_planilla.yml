name: "Cyber Planilla Operaciones (8, 14 y 18 h)"

# Actualiza la planilla "Seguimiento Cyber Oct2026 · Operaciones" en Drive (venta real por
# canal, WMS, arrastre de backlog) sin depender del PC de Andrés.
# Disparo: al terminar cada corrida del pulso Cyber (cyber_pulso.yml, que lanza cyber_reloj.py
# cada hora en punto). El cron de GitHub se atrasa horas, así que no se usa. Este workflow solo
# sigue si la hora de Chile es 08, 14 o 18; el resto de las horas termina en segundos.
# workflow_dispatch: correr a mano cuando se quiera, a cualquier hora.

on:
  workflow_run:
    workflows: ["Cyber Pulso (horario, Lun-Sab Cyber)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-planilla
  cancel-in-progress: false

env:
  TZ: America/Santiago

jobs:
  planilla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ¿Toca actualizar? (08, 14 o 18 h Chile)
        id: toca
        run: |
          H=$(date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ] || [ "$H" = "14" ] || [ "$H" = "18" ]; then
            echo "si=1" >> "$GITHUB_OUTPUT"; echo "Hora Chile $H: se actualiza la planilla"
          else
            echo "si=0" >> "$GITHUB_OUTPUT"; echo "Hora Chile $H: no toca"
          fi

      - name: Checkout
        if: steps.toca.outputs.si == '1'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.toca.outputs.si == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.toca.outputs.si == '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (enriquecimiento CMR del extract)
        if: steps.toca.outputs.si == '1'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json; else echo "[WARN] sin GOOGLE_CREDENTIALS_JSON — CMR se omite"; fi

      - name: Actualizar planilla
        if: steps.toca.outputs.si == '1'
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python actualizar_planilla_cyber.py

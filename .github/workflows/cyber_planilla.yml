name: "Cyber Planilla Operaciones (8, 14 y 18 h)"

# Actualiza la planilla "Seguimiento Cyber Oct2026 · Operaciones" en Drive (venta real por
# canal, WMS, arrastre de backlog) sin depender del PC de Andrés.
# Disparo: cyber_reloj.py lo lanza a las 08, 14 y 18 h CLT con esperar_min=10, para no cruzar
# esta extracción de Odoo con la del pulso. (Encadenarlo con workflow_run no sirve: GitHub no
# dispara workflows desde corridas lanzadas con el GITHUB_TOKEN, que es como corre el pulso.)
# A mano: Actions → este workflow → Run workflow (esperar_min = 0).

on:
  workflow_dispatch:
    inputs:
      esperar_min:
        description: 'Minutos de espera antes de actualizar (el reloj usa 10)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: cyber-planilla
  cancel-in-progress: false

env:
  TZ: America/Santiago

jobs:
  planilla:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Esperar (no cruzar la extracción con la del pulso)
        run: |
          M="${{ github.event.inputs.esperar_min }}"
          if [ -n "$M" ] && [ "$M" -gt 0 ]; then echo "Espero $M min"; sleep $(( M * 60 )); fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (enriquecimiento CMR del extract)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json; else echo "[WARN] sin GOOGLE_CREDENTIALS_JSON — CMR se omite"; fi

      - name: Actualizar planilla
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python actualizar_planilla_cyber.py

name: Agente Tickets NC (postventa)

# Decisión Andrés 26-08-2026 (opción B): emisión y posteo automático de NC por
# devoluciones de postventa. Reglas vigentes en nc_reglas.py (Max 17-sep y 05-oct):
# Motivo=Devolución + resolución no vacía + producto recepcionado; en automático
# solo Falabella, Mercado Libre, Paris, Ripley y Walmart; «PV» en el título y el
# resto de los canales van a gestión manual. NC por línea agrupada por OC; si hay
# NC previa NO emite y reporta a Max los lunes.
# Deshabilitar con vars.AGENTE_TICKETS_NC_ENABLED='false'.
# vars.AGENTE_NC_BOLETAS_AUTORIZADAS (lista separada por comas): si tiene boletas,
# emite solo esas (reactivación controlada 05-oct); vacía = sin restricción.

on:
  schedule:
    - cron: '19 11-23 * * 1-6'   # cada hora 07:19-19:19 CLT aprox, lun-sáb
  workflow_dispatch:
    inputs:
      full:
        description: "Barrido completo del histórico (no incremental)"
        type: boolean
        default: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.AGENTE_TICKETS_NC_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --quiet requests google-api-python-client google-auth google-auth-oauthlib
      - name: Correr agente
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          AGENTE_NC_BOLETAS_AUTORIZADAS: ${{ vars.AGENTE_NC_BOLETAS_AUTORIZADAS }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python agente_tickets_nc.py --auto --full
          else
            python agente_tickets_nc.py --auto
          fi

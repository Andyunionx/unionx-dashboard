name: "Sync COMEX transito (Google Sheet)"

on:
  schedule:
    # Cada 3h: el sheet lo actualizan manualmente en cualquier momento
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow gspread google-auth zstandard

      - name: Restaurar credentials.json desde secret
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "[ERROR] GOOGLE_CREDENTIALS_JSON secret no configurado"
            exit 1
          fi
          echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Ejecutar extraccion COMEX
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_comex_transito.py

      - name: Validar PIs contra Odoo (deteccion drive desactualizado)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_comex_validacion_odoo.py
        continue-on-error: true

      - name: Cruce dimensiones SKU (peso/volumen Odoo) → m³ y pallets por PI
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_comex_dimensiones.py
        continue-on-error: true

      - name: Commit parquet COMEX si cambio
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions COMEX"
          rm -f credentials.json
          git add data/comex/
          git diff --staged --quiet || git commit -m "COMEX transito $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

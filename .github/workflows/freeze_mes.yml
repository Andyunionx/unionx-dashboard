name: "Congelar mes (Odoo → parquet histórico)"

# Congela el mes ANTERIOR al parquet histórico re-extrayéndolo de Odoo (Turso murió).
# Corre el DÍA 1 TEMPRANO (06:00 UTC), ANTES del pulso diario (11:30 UTC) que
# sobrescribe mes_actual con el mes nuevo — así el mes recién cerrado ya quedó
# en el histórico y no se pierde en el rollover (incidente jun→jul 2026).

on:
  schedule:
    - cron: '0 6 1 * *'   # día 1 de cada mes, 06:00 UTC (~02:00-03:00 Chile)
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mes a congelar YYYY-MM (default: mes anterior al actual)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (enriquecimiento CMR)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          else
            echo "[WARN] GOOGLE_CREDENTIALS_JSON no configurado — CMR se omitirá"
          fi

      - name: Congelar mes (re-extrae de Odoo + avanza CUTOFF)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ github.event.inputs.mes }}" ]; then
            python extract_congelar_mes.py "${{ github.event.inputs.mes }}"
          else
            python extract_congelar_mes.py
          fi

      - name: Commit histórico + CUTOFF
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Freeze"
          git add data/historico/ventas_historico.parquet views/shared.py
          if git diff --staged --quiet; then
            echo "Sin cambios (mes ya congelado)"
          else
            git commit -m "Freeze mes: histórico + CUTOFF (Odoo) $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push || echo "Push falló (no crítico)"
          fi

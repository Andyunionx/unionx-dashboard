name: "Black Pulso (canales digitales 08, 12, 16 y 22 h, vie 27 → lun 30-nov)"

# Pulso del Black 2026, solo canales digitales (Marketplace + Fidelización + Páginas propias).
# Lo dispara black_reloj.yml a las 08, 12, 16 y 22 h CLT entre el vie 27-nov 12:00 y el lun 30-nov 22:00.
# Cada corrida re-extrae el mes en curso desde Odoo DENTRO del runner (no hace commit del parquet: no toca main)
# y enviar_pulso_black.py arma el correo; antes valida la venta del día contra Odoo (state=sale, tolerancia 10%).

on:
  workflow_dispatch:
    inputs:
      preborrador:
        description: 'Asunto [PRE-BORRADOR] y enviar solo a Andrés'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_email:
        description: 'Forzar el correo ignorando la hora'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      forzar_rango:
        description: 'Correr aunque esté fuera de las fechas del Black (pruebas; usar con preborrador=true)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: black-pulso
  cancel-in-progress: false

jobs:
  pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Restaurar credentials.json (CMR desde Sheet)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json; else echo "[WARN] sin GOOGLE_CREDENTIALS_JSON — CMR se omite"; fi

      - name: Re-extract mes en curso desde Odoo (solo en el runner, sin commit)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_mes_actual_a_parquet.py --source odoo

      - name: Enviar pulso Black
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # preborrador=true → solo Andrés. Lista del Black: variable BLACK_EMAIL_TO (mientras no exista, solo Andrés).
          EMAIL_TO: ${{ github.event.inputs.preborrador == 'true' && 'andres@unionx.cl' || (vars.BLACK_EMAIL_TO || 'andres@unionx.cl') }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          BLACK_PREBORRADOR: ${{ github.event.inputs.preborrador == 'true' && '1' || '0' }}
          BLACK_FORCE_EMAIL: ${{ github.event.inputs.force_email == 'true' && '1' || '0' }}
          BLACK_FORZAR_RANGO: ${{ github.event.inputs.forzar_rango == 'true' && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python enviar_pulso_black.py

name: Pulso Caja Semanal

on:
  schedule:
    # Objetivo ~08:00 CLT del lunes. Se programa 09:47 UTC (06:47 CLT) con minuto impar porque
    # GH free tier retrasa 1-4h los crons (peor en minuto 0): con el delay típico
    # aterriza entre 07:30 y 09:00 CLT (mismo ajuste que pulso_indicadores_diario, 5c3257d8).
    - cron: '47 9 * * 1'
  workflow_dispatch: {}

jobs:
  pulso-caja:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --quiet pandas pyarrow openpyxl google-api-python-client google-auth google-auth-oauthlib
      - name: Correr pulso
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python pulso_caja_semanal.py

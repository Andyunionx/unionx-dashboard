name: Sync Forecast (Prophet)

on:
  schedule:
    # Diario 06:00 UTC = 02:00 Chile (después del backup, antes del email)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias (Prophet)
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests prophet zstandard

      - name: Ejecutar forecast
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python extract_forecast.py

      - name: Commit forecasts si cambiaron
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Forecast"
          git add data/forecast/
          git diff --staged --quiet || git commit -m "Forecast $(date -u +'%Y-%m-%d')"
          git push

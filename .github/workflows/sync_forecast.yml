name: "Sync Forecast (Prophet completo: total + canal + SKU jerarquico)"

on:
  # Schedule desactivado 2026-05-18 porque disparaba notificaciones "No jobs were run".
  # Reactivar quitando el comentario del cron cuando el pipeline esté validado.
  # schedule:
  #   - cron: '0 6 * * *'  # Diario 06:00 UTC = 02:00 Chile
  workflow_dispatch:
    inputs:
      max_modelos:
        description: 'Max modelos Prophet SKU (default 200)'
        required: false
        default: '200'

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Prophet no está en requirements.txt (pesado, solo este workflow lo usa)
          pip install prophet

      - name: 1. Pricing historico
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python extract_pricing_historico.py

      - name: 2. Stock historico (incremental - actualiza ultimos 90d)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          STOCK_HIST_DESDE: 2024-01-01
          PYTHONIOENCODING: utf-8
        run: python extract_stock_historico.py
        continue-on-error: true   # si Odoo falla, seguimos con el resto

      - name: 3. Forecast total + canal
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python extract_forecast.py

      - name: 4. Forecast SKU x canal con regresores + jerarquia
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          DIAS_ADELANTE: '60'
          MAX_MODELOS: ${{ github.event.inputs.max_modelos || '200' }}
          PYTHONIOENCODING: utf-8
        run: python extract_forecast_skus.py
        continue-on-error: true

      - name: 5. Validation MAPE (backtest 60d) + sesgo Prophet TOTAL
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python extract_forecast_validation.py
        continue-on-error: true

      - name: 6a. Calibracion forecast TOTAL via ANCLAS de negocio
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_forecast_anchored.py
        continue-on-error: true

      - name: 6c. Forecast SKU x canal ANCHORED (Fase 2: elasticidad + basket + demanda)
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_forecast_skus_anchored.py
        continue-on-error: true

      - name: 6b. Reconciliacion MinT
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_forecast_mint.py
        continue-on-error: true

      - name: 7. Elasticidad-precio + market basket
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python extract_elasticidad_basket.py
        continue-on-error: true

      - name: 8. Evaluar alertas (incluye DQ)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python evaluar_alertas.py
        continue-on-error: true

      - name: 9. Capacidad bodega (refresca con forecast nuevo)
        env:
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python extract_capacidad_forecast.py
        continue-on-error: true

      - name: 10. Volumen operacional (pedidos/lineas/uds/carga equipo)
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_volumen_operacional.py
        continue-on-error: true

      - name: Commit parquets si cambiaron
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Forecast"
          git add data/forecast/ data/pricing_historico/ data/stock_historico/ data/capacidad/
          git diff --staged --quiet || git commit -m "Forecast pipeline $(date -u +'%Y-%m-%d')"
          git push

name: "Sync Finanzas (Planificación Financiera 2026)"

# Extractor de la planilla local Planificacion Financiera 2026.xlsx
# (flujo de caja, deuda, KT, etc).
#
# El Sheet de Drive con el P&L Control de Gestion se sincroniza en un workflow
# dedicado: .github/workflows/sync_pyl_drive.yml (1x al dia).

on:
  push:
    paths:
      - 'data/planillas/Planificación Financiera 2026.xlsx'
      - 'extract_finanzas_planificacion.py'
  schedule:
    # Backup cada 6 horas por si se modificó sin disparar push
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_finanzas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow openpyxl

      - name: Extract Planificación Financiera → parquets
        env:
          PYTHONIOENCODING: utf-8
        run: python extract_finanzas_planificacion.py

      - name: Commit parquets si cambiaron
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Finanzas"
          git pull --rebase origin main || true
          git add data/finanzas/ || true
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear"
          else
            git commit -m "Finanzas snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then
                echo "Push OK (intento $i)"
                break
              fi
              echo "Push fallo (intento $i), reintentando..."
              git pull --rebase origin main || true
              sleep 5
            done
          fi

name: "Reporte semanal Rentabilidad por canal (lunes)"

# Cada lunes, después de la macro (13:00 y 16:00 UTC), manda a Gabriela con copia a
# Andrés el reporte de rentabilidad: resultado del último mes cerrado, dónde dar ojo,
# seguimiento del plan de acción (con alertas de gestión) y estado de la automatización
# (liquidaciones en la carpeta de Drive + cuadre de la lectura automática vs la carga).
# Guard: si ya salió hoy, no vuelve a enviar (el cron de GHA free puede duplicar/atrasar).

on:
  schedule:
    - cron: '0 17 * * 1'      # 14:00 CLT lunes
    - cron: '0 19 * * 1'      # 16:00 CLT — segunda ventana si la primera no disparó
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Enviar aunque ya haya salido hoy'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.g.outputs.seguir }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then echo "seguir=true" >> $GITHUB_OUTPUT; exit 0; fi
          # "Hoy" en hora de Chile: el cron atrasado puede caer después de la medianoche UTC y, con la
          # fecha UTC, la segunda corrida del lunes se veía como de otro día (5-oct salió dos veces).
          DESDE=$(date -u -d "$(TZ=America/Santiago date +%Y-%m-%d) 00:00 $(TZ=America/Santiago date +%z)" +%Y-%m-%dT%H:%M:%SZ)
          echo "Corridas exitosas desde ${DESDE} (00:00 hora Chile)"
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/rentabilidad_semanal.yml/runs?created=>=${DESDE}&status=success" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          if [ "$N" -gt 0 ]; then echo "Ya salió hoy ($N corridas exitosas)"; echo "seguir=false" >> $GITHUB_OUTPUT; else echo "seguir=true" >> $GITHUB_OUTPUT; fi

  reporte:
    needs: guard
    if: needs.guard.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Enviar reporte
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          RENTABILIDAD_TO: ${{ vars.RENTABILIDAD_TO || 'gabriela@unionx.cl' }}
          RENTABILIDAD_CC: ${{ vars.RENTABILIDAD_CC || 'andres@unionx.cl' }}
          PYTHONIOENCODING: utf-8
        run: python -u rentabilidad_reporte_semanal.py --enviar

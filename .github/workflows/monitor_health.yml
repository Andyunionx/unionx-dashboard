name: Monitor Health Workflows (daily 09:00 CLT)

# Verifica que los workflows críticos (email_diario, sync_mes_actual, etc.)
# hayan corrido con éxito dentro del umbral configurado. Si alguno se atrasa,
# manda alerta por mail.

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 09:00 CLT (1h después del pulso diario)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install requests

      - name: Verificar workflows críticos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_READ_ACTIONS || secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.MONITOR_EMAIL_TO || 'andres@unionx.cl' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          PYTHONIOENCODING: utf-8
        run: python monitor_workflows.py

name: "Cyber Health Monitor"

# Sistema 360 que cada 30 min verifica salud del pipeline Cyber:
# - Compara Turso vs Odoo (state=sale) para detectar lag
# - Detecta y limpia duplicados automáticamente (junio + mayo)
# - Envía email solo si hay issues que no pudo auto-corregir
#
# Diseño: idempotente, robusto, autosuficiente. No requiere intervención manual.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Ejecutar monitor
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          ANDRES_ODOO_PASSWORD: ${{ secrets.ANDRES_ODOO_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.CYBER_EMAIL_TO || 'andres@unionx.cl' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
          PYTHONIOENCODING: utf-8
        run: python cyber_health_monitor.py
